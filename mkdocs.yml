site_name: Agentic Coding with GitHub Copilot
site_description: Self-paced labs for custom instructions, agent skills, and custom agents, using a real Spring Boot app.
site_url: https://sabajamalian.github.io/github-copilot-101/
repo_url: https://github.com/sabajamalian/github-copilot-101
repo_name: sabajamalian/github-copilot-101
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Start here: index.md
  - Setup: setup.md
  - Modules:
      - Custom instructions: modules/custom-instructions.md
      - Agent skills: modules/agent-skills.md
      - Custom agents: modules/custom-agents.md
  - Capstone: capstone.md
  - Resources: resources.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sabajamalian/github-copilot-101

strict: true
